<section class="section-pad bg-gradient-to-b from-surface-alt via-white to-brand-50/30" id="precios">
  <div class="container-page">
    <app-section-header
      appReveal
      align="center"
      eyebrow="Precios"
      title="Planes adaptados a tu negocio"
      lead="Elige el enfoque que mejor se ajuste a tu operación. Te compartimos el detalle comercial según tus necesidades."
    />

    <div class="grid items-stretch gap-4 md:grid-cols-3">
      @for (plan of plans; track plan.name) {
        <article
          class="relative flex flex-col gap-3.5 rounded-3xl border border-slate-200 bg-white p-6 shadow-soft transition duration-300 hover:-translate-y-1 hover:shadow-lift"
          [class.border-transparent]="plan.highlighted"
          [class.bg-gradient-to-b]="plan.highlighted"
          [class.from-white]="plan.highlighted"
          [class.to-brand-50]="plan.highlighted"
          [class.shadow-lift]="plan.highlighted"
          [class.ring-2]="plan.highlighted"
          [class.ring-brand-500]="plan.highlighted"
          [class.md:-translate-y-1.5]="plan.highlighted"
          appReveal
        >
          @if (plan.highlighted) {
            <span class="absolute -top-3 right-4 rounded-full bg-gradient-to-r from-brand-500 to-brand-700 px-2.5 py-1 text-[0.75rem] font-extrabold text-white shadow-brand">
              Recomendado
            </span>
          }
          <h3 class="font-display text-[1.35rem] font-bold text-navy-900">{{ plan.name }}</h3>
          <p class="text-muted">{{ plan.description }}</p>
          <div class="font-display text-[1.35rem] font-bold text-navy-900">Solicitar información</div>
          <ul class="mb-3 mt-1 grid flex-1 gap-2">
            @for (feature of plan.features; track feature) {
              <li class="relative pl-5 text-[0.92rem] text-slate-600 before:absolute before:left-0 before:font-extrabold before:text-brand-600 before:content-['✓']">
                {{ feature }}
              </li>
            }
          </ul>
          <app-btn [variant]="plan.highlighted ? 'primary' : 'secondary'" href="#cta-final" [block]="true">
            Solicitar información
          </app-btn>
        </article>
      }
    </div>
  </div>
</section>
