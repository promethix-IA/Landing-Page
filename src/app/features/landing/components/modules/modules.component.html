<section class="section-pad bg-white" id="funcionalidades">
  <div class="container-page">
    <app-section-header
      appReveal
      eyebrow="Módulos del POS"
      title="Todo tu negocio, desde un solo lugar"
      lead="Cada módulo está diseñado para que la operación diaria sea más clara, rápida y conectada."
    />

    <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
      @for (module of modules; track module.title) {
        <article class="card-surface group relative flex flex-col gap-4 overflow-hidden p-5" appReveal [attr.data-accent]="module.accent">
          <div class="pointer-events-none absolute -right-8 -top-8 size-28 rounded-full bg-brand-400/10 blur-2xl transition group-hover:bg-brand-400/20"></div>
          <div class="relative">
            <h3 class="font-display text-[1.15rem] font-bold text-navy-900">{{ module.title }}</h3>
            <p class="mt-2 text-[0.94rem] text-muted">{{ module.description }}</p>
          </div>
          <ul class="relative grid gap-2">
            @for (point of module.points; track point) {
              <li class="relative pl-4 text-[0.9rem] text-slate-600 before:absolute before:left-0 before:top-[0.55rem] before:size-1.5 before:rounded-full before:bg-brand-600 before:shadow-[0_0_8px_rgba(27,110,243,0.7)] before:content-['']">
                {{ point }}
              </li>
            }
          </ul>
          @if (module.accent === 'billing') {
            <div class="relative mt-auto inline-flex items-center gap-2 rounded-full bg-emerald-500/10 px-3 py-2 text-[0.82rem] font-bold text-emerald-700">
              <span class="status-dot" aria-hidden="true"></span>
              Integración DIAN · Estado: Conectado
            </div>
          }
        </article>
      }
    </div>
  </div>
</section>
