<section class="section-pad bg-gradient-to-b from-surface-alt to-white" id="beneficios">
  <div class="container-page">
    <app-section-header
      appReveal
      align="center"
      eyebrow="Beneficios"
      title="Más control. Menos trabajo."
      lead="Una plataforma pensada para simplificar la operación y dar claridad sobre el negocio."
    />

    <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
      @for (item of items; track item.title) {
        <article class="card-surface group p-5" appReveal>
          <div class="mb-3.5 size-9 rounded-xl bg-gradient-to-br from-brand-500/20 to-brand-50 shadow-sm transition group-hover:scale-110 group-hover:shadow-glow"></div>
          <h3 class="font-display text-[1.08rem] font-bold text-navy-900">{{ item.title }}</h3>
          <p class="mt-2 text-muted">{{ item.description }}</p>
        </article>
      }
    </div>
  </div>
</section>
