<section class="border-b border-slate-200/80 bg-white/90 py-8 backdrop-blur-sm" aria-label="Capacidades principales">
  <div class="container-page" appReveal>
    <h2 class="mb-5 text-center font-display text-[clamp(1.15rem,2vw,1.4rem)] font-bold text-navy-900">
      Todo lo que necesitas para administrar tu negocio
    </h2>
    <ul class="flex flex-wrap justify-center gap-2.5">
      @for (item of items; track item.label) {
        <li class="inline-flex items-center gap-2 rounded-full border border-brand-100 bg-brand-50 px-3.5 py-2 text-[0.88rem] font-bold text-navy-900 shadow-sm transition hover:-translate-y-0.5 hover:shadow-soft">
          <span class="grid size-5 place-items-center rounded-full bg-brand-600 text-[0.7rem] text-white shadow-brand" aria-hidden="true">✓</span>
          {{ item.label }}
        </li>
      }
    </ul>
  </div>
</section>
