<section class="section-pad" id="seguridad">
  <div class="container-page rounded-[28px] border border-slate-200 bg-gradient-to-b from-brand-50/80 to-white p-6 shadow-soft md:p-10" appReveal>
    <app-section-header
      eyebrow="Seguridad y confiabilidad"
      title="Tu información, siempre bajo control"
      lead="Medidas orientadas a proteger el acceso y la continuidad de la información de tu negocio."
    />

    <ul class="grid gap-3 sm:grid-cols-2 xl:grid-cols-5">
      @for (item of items; track item.title) {
        <li class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm transition hover:-translate-y-0.5 hover:shadow-soft">
          <strong class="block text-[0.95rem] text-navy-900">{{ item.title }}</strong>
          <span class="mt-1 block text-[0.86rem] text-muted">{{ item.description }}</span>
        </li>
      }
    </ul>
  </div>
</section>
