<section class="section-pad mesh-navy relative overflow-hidden" id="ia">
  <div class="pointer-events-none absolute left-1/2 top-0 h-64 w-64 -translate-x-1/2 rounded-full bg-brand-500/20 blur-3xl" aria-hidden="true"></div>
  <div class="container-page relative">
    <app-section-header
      appReveal
      tone="light"
      eyebrow="Inteligencia Artificial"
      title="Tu negocio también puede pensar contigo."
      lead="La Inteligencia Artificial analiza la información de tu negocio para ayudarte a tomar mejores decisiones."
    />

    <div class="ai__panel mx-auto max-w-[820px] overflow-hidden rounded-3xl border border-white/15 bg-white/5 shadow-lift backdrop-blur-xl" appReveal role="img" aria-label="Interfaz demostrativa del asistente de IA">
      <div class="flex items-center justify-between gap-4 border-b border-white/10 px-5 py-4">
        <div>
          <strong class="block text-white">Asistente Promethixia</strong>
          <p class="mt-0.5 text-[0.88rem] text-white/65">Consultas en lenguaje natural sobre tu operación</p>
        </div>
        <span class="shrink-0 rounded-full bg-brand-400/20 px-3 py-1.5 text-[0.78rem] font-bold text-brand-200 shadow-glow">IA activa</span>
      </div>

      <div class="grid gap-3.5 p-5">
        @for (message of messages; track $index) {
          <div
            class="max-w-[85%] rounded-2xl px-4 py-3.5 max-sm:max-w-full"
            [class.ml-auto]="message.role === 'user'"
            [class.bg-brand-600]="message.role === 'user'"
            [class.text-white]="message.role === 'user'"
            [class.rounded-br-md]="message.role === 'user'"
            [class.bg-white/10]="message.role === 'assistant'"
            [class.text-blue-50]="message.role === 'assistant'"
            [class.rounded-bl-md]="message.role === 'assistant'"
            [class.shadow-brand]="message.role === 'user'"
            [class.border]="message.role === 'assistant'"
            [class.border-white/10]="message.role === 'assistant'"
          >
            <span class="mb-1 block text-[0.72rem] font-bold uppercase tracking-wide opacity-70">
              {{ message.role === 'user' ? 'Tú' : 'IA' }}
            </span>
            <p class="text-[0.95rem] leading-relaxed">{{ message.text }}</p>
          </div>
        }
      </div>

      <div class="mx-5 mb-5 flex items-center justify-between gap-4 rounded-2xl border border-white/10 bg-white/5 px-4 py-3.5 text-[0.9rem] text-white/55" aria-hidden="true">
        <span>Escribe una consulta sobre tu negocio...</span>
        <strong class="rounded-[10px] bg-brand-600 px-3 py-1.5 text-[0.82rem] text-white shadow-brand">Enviar</strong>
      </div>
    </div>
  </div>
</section>
