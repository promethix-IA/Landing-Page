<header
  class="nav sticky top-0 z-[100] h-[72px] transition-all duration-300"
  [class.nav--scrolled]="scrolled"
  [class.nav--open]="menuOpen"
>
  <div class="container-page nav__inner flex h-full items-center gap-4">
    <a class="nav__brand inline-flex min-w-0 items-center gap-2.5 font-display font-bold text-[1.15rem] text-navy-900" href="#inicio" (click)="closeMenu()" aria-label="Promethixia - Inicio">
      <app-logo [size]="36" [textSize]="1.2" />
    </a>

    <nav class="nav__links ml-5 flex items-center gap-0.5" [class.is-open]="menuOpen" aria-label="Principal">
      @for (item of items; track item.href) {
        <a class="rounded-[10px] px-2.5 py-2 text-[0.9rem] font-semibold text-muted transition hover:bg-brand-50 hover:text-navy-900" [href]="item.href" (click)="closeMenu()">{{ item.label }}</a>
      }
      <div class="nav__mobile-actions hidden">
        <app-btn variant="primary" [block]="true" [href]="demoMailto" (click)="closeMenu()">Solicitar demostración</app-btn>
      </div>
    </nav>

    <div class="nav__actions ml-auto flex items-center gap-2.5">
      <app-btn variant="primary" [href]="demoMailto">Solicitar demostración</app-btn>
    </div>

    <button
      class="nav__toggle hidden size-[42px] flex-col items-center justify-center gap-[5px] rounded-xl border border-slate-200 bg-white p-0"
      type="button"
      [attr.aria-expanded]="menuOpen"
      aria-controls="mobile-menu"
      aria-label="Abrir menú"
      (click)="toggleMenu()"
    >
      <span class="block h-0.5 w-[18px] rounded bg-navy-900 transition"></span>
      <span class="block h-0.5 w-[18px] rounded bg-navy-900 transition"></span>
      <span class="block h-0.5 w-[18px] rounded bg-navy-900 transition"></span>
    </button>
  </div>
</header>
