<header
  class="nav sticky top-0 z-[100] h-[72px] transition-all duration-300"
  [class.nav--scrolled]="scrolled"
  [class.nav--open]="menuOpen"
>
  <div class="container-page nav__inner flex h-full items-center gap-4">
    <a class="nav__brand inline-flex items-center gap-2.5 font-display font-bold text-[1.15rem] text-navy-900" href="#inicio" (click)="closeMenu()" aria-label="Promethixia - Inicio">
      <span class="nav__mark grid size-[34px] place-items-center rounded-[10px] bg-gradient-to-br from-brand-500 to-brand-700 text-white text-[0.95rem] shadow-brand" aria-hidden="true">P</span>
      <span class="nav__name">{{ brand }}</span>
    </a>

    <nav class="nav__links ml-5 flex items-center gap-0.5" [class.is-open]="menuOpen" aria-label="Principal">
      @for (item of items; track item.href) {
        <a class="rounded-[10px] px-2.5 py-2 text-[0.9rem] font-semibold text-muted transition hover:bg-brand-50 hover:text-navy-900" [href]="item.href" (click)="closeMenu()">{{ item.label }}</a>
      }
      <div class="nav__mobile-actions hidden">
        <app-btn variant="secondary" href="#experiencia-pos" (click)="closeMenu()">Ver demostración</app-btn>
        <app-btn variant="primary" href="#cta-final" (click)="closeMenu()">Comenzar ahora</app-btn>
      </div>
    </nav>

    <div class="nav__actions ml-auto flex items-center gap-2.5">
      <app-btn variant="secondary" href="#experiencia-pos">Ver demostración</app-btn>
      <app-btn variant="primary" href="#cta-final">Comenzar ahora</app-btn>
    </div>

    <button
      class="nav__toggle ml-auto hidden size-[42px] flex-col items-center justify-center gap-[5px] rounded-xl border border-slate-200 bg-white p-0"
      type="button"
      [attr.aria-expanded]="menuOpen"
      aria-controls="mobile-menu"
      aria-label="Abrir menú"
      (click)="toggleMenu()"
    >
      <span class="block h-0.5 w-[18px] rounded bg-navy-900 transition"></span>
      <span class="block h-0.5 w-[18px] rounded bg-navy-900 transition"></span>
      <span class="block h-0.5 w-[18px] rounded bg-navy-900 transition"></span>
    </button>
  </div>
</header>
